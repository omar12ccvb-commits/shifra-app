<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>شفرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f; --bg-elev:#131318; --bg-elev-2:#1c1c24;
    --border:#28282f; --border-soft:#1e1e25;
    --text:#f5f4f7; --text-dim:#9d9aa8; --text-faint:#6b6875;
    --purple:#8b5cf6; --purple-hover:#7c3aed; --purple-soft:rgba(139,92,246,0.14); --purple-soft-2:rgba(139,92,246,0.28);
    --green:#34d399; --green-soft:rgba(52,211,153,0.14);
    --red:#f87171; --red-soft:rgba(248,113,113,0.14);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,0.14);
    --blue:#60a5fa; --blue-soft:rgba(96,165,250,0.14);
    --radius:16px; --radius-sm:10px;
    --font:'IBM Plex Sans Arabic', sans-serif; --mono:'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
    background-image: radial-gradient(ellipse 800px 500px at 50% -15%, rgba(139,92,246,0.12), transparent 60%);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  .ltr{ direction:ltr; unicode-bidi:isolate; font-family:var(--mono); }
  .mono{ font-family:var(--mono); direction:ltr; unicode-bidi:isolate; }
  a{ color:inherit; } button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--purple-soft-2); }

  /* ---------- Auth ---------- */
  #auth-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .auth-card{ width:100%; max-width:380px; animation:rise .5s cubic-bezier(.16,1,.3,1); }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; justify-content:center; }
  .brand-mark{
    width:42px; height:42px; border-radius:12px; background:linear-gradient(155deg, var(--purple), #5b21b6);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:600;
    font-size:17px; color:#fff; box-shadow:0 4px 20px -4px rgba(139,92,246,0.5);
  }
  .brand-text{ font-weight:700; font-size:21px; }
  .brand-sub{ color:var(--text-faint); font-size:11.5px; font-family:var(--mono); direction:ltr; }
  .auth-tabs{ display:flex; background:var(--bg-elev); border:1px solid var(--border); border-radius:99px; padding:4px; margin-bottom:22px; }
  .auth-tab{ flex:1; text-align:center; padding:9px; border-radius:99px; border:none; background:transparent; color:var(--text-dim); font-weight:600; font-size:13.5px; transition:all .15s; }
  .auth-tab.active{ background:var(--purple); color:#fff; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); padding:12px 14px; font-size:14.5px; font-family:inherit; outline:none; transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--purple); }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .role-picker{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .role-opt{ background:var(--bg-elev-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 6px 12px; text-align:center; color:var(--text-dim); transition:all .15s; }
  .role-opt .role-ic{ font-size:20px; margin-bottom:6px; }
  .role-opt .role-name{ font-size:12.5px; font-weight:700; }
  .role-opt .role-tag{ font-size:10px; margin-top:2px; opacity:.8; line-height:1.3; }
  .role-opt.active{ border-color:var(--purple); background:var(--purple-soft); color:#e4d9ff; }
  .role-desc{ background:var(--bg-elev-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:11px 13px; font-size:12.5px; color:var(--text-dim); margin-bottom:16px; line-height:1.6; }
  .btn{ border:none; border-radius:var(--radius-sm); padding:13px 18px; font-size:14.5px; font-weight:600; transition:filter .15s, transform .1s; }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ background:var(--purple); color:#fff; width:100%; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:.5; }
  .btn-ghost{ background:var(--bg-elev-2); color:var(--text-dim); border:1px solid var(--border); }
  .btn-ghost:hover{ color:var(--text); }
  .btn-danger{ background:var(--red-soft); color:var(--red); border:1px solid rgba(248,113,113,.3); }
  .btn-sm{ padding:9px 14px; font-size:13px; border-radius:8px; }
  .btn-block{ width:100%; }
  .btn-row{ display:flex; gap:8px; }
  .btn-row .btn{ flex:1; }
  .auth-error{ background:var(--red-soft); color:var(--red); border:1px solid rgba(248,113,113,.3); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:14px; display:none; }
  .auth-note{ text-align:center; font-size:12px; color:var(--text-faint); margin-top:16px; }
  details.adv{ margin-top:6px; margin-bottom:14px; }
  details.adv summary{ font-size:12px; color:var(--text-faint); cursor:pointer; }

  /* ---------- App shell (mobile-first) ---------- */
  #app-shell{ display:none; min-height:100vh; padding-bottom:78px; }
  #app-shell.active{ display:block; }
  .app-topbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 18px 6px; }
  .app-topbar .brand-text{ font-size:16px; }
  .app-topbar .brand{ margin-bottom:0; justify-content:flex-start; }
  .app-topbar .brand-mark{ width:32px; height:32px; font-size:13px; border-radius:9px; }
  .page-head{ padding:14px 18px 4px; }
  .page-title{ font-size:22px; font-weight:700; }
  .page-sub{ font-size:12.5px; color:var(--text-faint); margin-top:2px; }
  .content{ padding:14px 18px 40px; max-width:720px; margin:0 auto; }

  .bottom-nav{
    position:fixed; bottom:0; inset-inline:0; display:flex; background:rgba(10,10,15,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--border); padding:8px 6px calc(8px + env(safe-area-inset-bottom)); z-index:40; gap:2px;
  }
  .nav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border:none; background:transparent; color:var(--text-faint); font-size:10.5px; font-weight:600; border-radius:10px; }
  .nav-item .ic{ font-size:19px; }
  .nav-item.active{ color:var(--purple); }
  .user-menu-btn{ width:34px; height:34px; border-radius:50%; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text-dim); font-size:13px; font-weight:700; }
  .sidebar{ display:none; } /* base: hidden on mobile regardless of #app-shell state; the 820px query below turns it on */

  @media (min-width:820px){
    #app-shell{ display:none; padding-bottom:0; }
    #app-shell.active{ display:flex; }
    .app-topbar{ display:none; }
    .sidebar{
      width:240px; flex-shrink:0; border-inline-start:1px solid var(--border); padding:22px 14px;
      display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
    }
    .sidebar .brand{ justify-content:flex-start; padding:0 8px 22px; }
    #nav-list-mobile{ display:none; } /* the sidebar's own nav-list-desktop takes over entirely on wide screens */
    #nav-list-desktop{ position:static; flex-direction:column; background:transparent; backdrop-filter:none; border:none; padding:0; gap:2px; }
    .nav-item{ flex-direction:row; justify-content:flex-start; gap:10px; padding:10px 12px; font-size:13.5px; }
    .nav-item.active{ background:var(--purple-soft); color:#e4d9ff; }
    .sidebar-footer{ margin-top:auto; padding-top:14px; border-top:1px solid var(--border-soft); }
    .main{ flex:1; min-width:0; }
    .page-head{ padding:26px 32px 6px; } .content{ padding:14px 32px 60px; max-width:900px; margin:0; }
  }

  /* ---------- Components ---------- */
  .card{ background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
  .list-card{ display:block; width:100%; text-align:start; margin-bottom:10px; }
  .list-card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .list-card-title{ font-family:var(--mono); font-weight:600; font-size:15px; direction:ltr; text-align:start; }
  .list-card-meta{ font-size:12.5px; color:var(--text-faint); display:flex; gap:10px; flex-wrap:wrap; }
  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:11px; font-weight:600; white-space:nowrap; }
  .badge-purple{ background:var(--purple-soft); color:#cbb6ff; } .badge-green{ background:var(--green-soft); color:var(--green); }
  .badge-red{ background:var(--red-soft); color:var(--red); } .badge-amber{ background:var(--amber-soft); color:var(--amber); }
  .badge-blue{ background:var(--blue-soft); color:var(--blue); } .badge-gray{ background:var(--bg-elev-2); color:var(--text-dim); border:1px solid var(--border); }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-faint); }
  .empty-state .ic{ font-size:32px; margin-bottom:12px; }
  .loading-row{ padding:50px; text-align:center; color:var(--text-faint); }
  .spinner{ width:16px; height:16px; border:2px solid rgba(255,255,255,.2); border-top-color:#fff; border-radius:50%; display:inline-block; animation:spin .7s linear infinite; vertical-align:middle; }
  @keyframes spin{ to{transform:rotate(360deg);} }
  .section-title{ font-size:14px; font-weight:700; margin:22px 0 10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; }
  .section-title:first-child{ margin-top:0; }
  .kv{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--border-soft); font-size:13.5px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--text-dim); }
  .kv .v{ font-weight:600; }
  .backlink{ display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:13.5px; margin-bottom:14px; }
  .price-hero{ text-align:center; padding:22px 10px; }
  .price-hero .amt{ font-family:var(--mono); font-size:34px; font-weight:600; }
  .price-hero .lbl{ font-size:12.5px; color:var(--text-faint); margin-top:4px; }
  .timeline{ position:relative; padding-inline-start:22px; }
  .chat-box{ background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
  .chat-messages{ max-height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-inline-end:4px; margin-bottom:12px; }
  .chat-msg{ max-width:80%; padding:9px 13px; border-radius:14px; font-size:13.5px; line-height:1.5; }
  .chat-msg.mine{ align-self:flex-end; background:var(--purple); color:#fff; border-end-end-radius:4px; }
  .chat-msg.theirs{ align-self:flex-start; background:var(--bg-elev-2); border-end-start-radius:4px; }
  .chat-msg .chat-meta{ font-size:10.5px; opacity:.75; margin-bottom:3px; font-weight:600; }
  .chat-msg .chat-time{ font-size:10px; opacity:.6; margin-top:3px; text-align:end; font-family:var(--mono); direction:ltr; }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row textarea{ flex:1; min-height:42px; max-height:100px; }
  .chat-input-row button{ flex-shrink:0; align-self:flex-end; }
  .timeline::before{ content:''; position:absolute; inset-inline-start:6px; top:4px; bottom:4px; width:1px; background:var(--border); }
  .timeline-item{ position:relative; padding-bottom:16px; font-size:13px; }
  .timeline-item::before{ content:''; position:absolute; inset-inline-start:-22px; top:3px; width:9px; height:9px; border-radius:50%; background:var(--purple); }
  .timeline-item .t-title{ font-weight:600; } .timeline-item .t-time{ color:var(--text-faint); font-size:11.5px; font-family:var(--mono); }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:flex-end; justify-content:center; z-index:50; backdrop-filter:blur(2px); }
  @media (min-width:820px){ .modal-overlay{ align-items:center; } }
  .modal-overlay.active{ display:flex; }
  .modal{ background:var(--bg-elev); border:1px solid var(--border); border-radius:20px 20px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); width:100%; max-width:440px; animation:rise .3s cubic-bezier(.16,1,.3,1); }
  @media (min-width:820px){ .modal{ border-radius:16px; } }
  .modal h3{ font-size:16px; margin-bottom:16px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; }
  .toast{ position:fixed; bottom:92px; inset-inline:16px; background:var(--bg-elev-2); border:1px solid var(--border); padding:13px 16px; border-radius:12px; font-size:13.5px; z-index:100; box-shadow:0 10px 30px -8px rgba(0,0,0,.5); animation:rise .25s cubic-bezier(.16,1,.3,1); text-align:center; }
  @media (min-width:820px){ .toast{ inset-inline-start:auto; inset-inline-end:24px; max-width:320px; bottom:24px; } }
  .toast.err{ border-color:rgba(248,113,113,.4); color:#fecaca; } .toast.ok{ border-color:rgba(52,211,153,.4); color:#bbf7d0; }
  .fab-actions{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
</style>

<style id="shefra-premium-ui">
  :root{
    --brand-a:#9b7cff;
    --brand-b:#6d45ff;
    --brand-c:#38bdf8;
    --glass:rgba(19,19,24,.72);
    --glow:rgba(139,92,246,.30);
  }
  html{scroll-behavior:smooth;color-scheme:dark}
  body{
    background-image:
      radial-gradient(ellipse 700px 420px at 15% -8%, rgba(155,124,255,.18), transparent 62%),
      radial-gradient(ellipse 650px 460px at 92% 5%, rgba(56,189,248,.08), transparent 68%),
      linear-gradient(180deg,#08080d 0%,#0b0b11 45%,#09090f 100%);
    animation:shefraAmbient 16s ease-in-out infinite alternate;
  }
  @keyframes shefraAmbient{
    0%{background-position:0 0,100% 0,0 0}
    100%{background-position:28px 16px,calc(100% - 22px) 18px,0 0}
  }
  .brand-mark{
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(circle at 28% 22%,rgba(255,255,255,.28),transparent 28%),
      linear-gradient(145deg,var(--brand-a),var(--brand-b) 55%,#4c1d95);
    box-shadow:0 8px 28px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.18);
    animation:shefraLogoFloat 4.5s ease-in-out infinite;
  }
  .brand-mark::after{
    content:"";
    position:absolute; inset:-40% -70%;
    background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.34) 50%,transparent 65%);
    transform:translateX(-80%);
    animation:shefraShine 6s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes shefraLogoFloat{50%{transform:translateY(-2px) rotate(-1deg)}}
  @keyframes shefraShine{0%,62%{transform:translateX(-90%)}78%,100%{transform:translateX(90%)}}

  .brand-text{
    background:linear-gradient(110deg,#fff 0%,#e9e2ff 45%,#c9b8ff 80%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .page-title{
    background:linear-gradient(110deg,#fff 0%,#e8dcff 48%,#b7e8ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.1px;
  }
  .card,.list-card,.chat-box,.table-wrap,.role-opt,.auth-tabs,.field input,.field select,.field textarea{
    transition:
      transform .25s cubic-bezier(.2,.8,.2,1),
      border-color .25s ease,
      box-shadow .25s ease,
      background-color .25s ease;
  }
  .card,.list-card,.chat-box{
    position:relative;
    overflow:hidden;
  }
  .card::before,.list-card::before,.chat-box::before{
    content:"";
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.045),transparent 24%,transparent 75%,rgba(155,124,255,.04));
    opacity:.72;
  }
  .card:hover,.list-card:hover,.chat-box:hover{
    transform:translateY(-3px);
    border-color:rgba(155,124,255,.28);
    box-shadow:0 16px 42px -24px rgba(0,0,0,.9),0 0 0 1px rgba(155,124,255,.05);
  }
  .btn,.nav-item,.auth-tab,.role-opt,.user-menu-btn{
    position:relative;
    overflow:hidden;
    transition:
      transform .18s cubic-bezier(.2,.8,.2,1),
      filter .2s ease,
      background .2s ease,
      border-color .2s ease,
      color .2s ease,
      box-shadow .2s ease;
  }
  .btn:hover,.nav-item:hover,.auth-tab:hover,.role-opt:hover,.user-menu-btn:hover{
    transform:translateY(-1px);
  }
  .btn-primary{
    background:linear-gradient(110deg,var(--brand-b),#7c3aed 55%,#5b21b6);
    box-shadow:0 10px 25px -16px rgba(139,92,246,.95),inset 0 1px 0 rgba(255,255,255,.12);
  }
  .btn-primary:hover{
    filter:brightness(1.1);
    box-shadow:0 14px 30px -16px rgba(139,92,246,1),0 0 0 1px rgba(255,255,255,.06);
  }
  .btn:focus-visible,.nav-item:focus-visible,.auth-tab:focus-visible,.role-opt:focus-visible,.field input:focus,.field select:focus,.field textarea:focus{
    outline:none;
    box-shadow:0 0 0 3px rgba(139,92,246,.18),0 0 0 1px rgba(139,92,246,.7);
  }
  .bottom-nav{
    background:rgba(8,8,13,.78)!important;
    box-shadow:0 -12px 34px -26px rgba(155,124,255,.7);
  }
  .nav-item.active{
    position:relative;
    box-shadow:inset 0 0 0 1px rgba(155,124,255,.10),0 8px 20px -18px rgba(155,124,255,.95);
  }
  .nav-item.active::after{
    content:"";
    position:absolute;
    inset-inline-start:12px;
    inset-inline-end:12px;
    bottom:2px;
    height:2px;
    border-radius:999px;
    background:linear-gradient(90deg,transparent,var(--brand-a),transparent);
    animation:shefraPulse 2.1s ease-in-out infinite;
  }
  @keyframes shefraPulse{50%{opacity:.35;transform:scaleX(.78)}}

  .badge{
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .spinner{filter:drop-shadow(0 0 6px rgba(255,255,255,.25))}
  .toast{
    backdrop-filter:blur(16px);
    background:rgba(27,27,36,.86)!important;
    box-shadow:0 18px 48px -20px rgba(0,0,0,.85),0 0 0 1px rgba(155,124,255,.06);
  }
  .modal-overlay{backdrop-filter:blur(8px)!important;background:rgba(2,2,8,.64)!important}
  .modal{
    background:linear-gradient(180deg,rgba(25,25,34,.96),rgba(17,17,24,.96))!important;
    box-shadow:0 28px 90px -30px rgba(0,0,0,.96),0 0 0 1px rgba(155,124,255,.07);
  }
  #content.ui-refresh > *{animation:shefraRouteIn .48s cubic-bezier(.16,1,.3,1) both}
  #content.ui-refresh .card,#content.ui-refresh .list-card,#content.ui-refresh .chat-box,
  #content.ui-refresh .table-wrap{animation:shefraCardIn .52s cubic-bezier(.16,1,.3,1) both}
  #content.ui-refresh > *:nth-child(2){animation-delay:.035s}
  #content.ui-refresh > *:nth-child(3){animation-delay:.07s}
  #content.ui-refresh > *:nth-child(4){animation-delay:.105s}
  @keyframes shefraRouteIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes shefraCardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}

  .ui-ripple{
    position:absolute!important;
    border-radius:999px;
    pointer-events:none;
    width:18px;height:18px;
    transform:translate(-50%,-50%) scale(0);
    background:rgba(255,255,255,.22);
    animation:shefraRipple .55s ease-out forwards;
  }
  @keyframes shefraRipple{to{transform:translate(-50%,-50%) scale(14);opacity:0}}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#292934;border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:#3a3a49}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="brand"><div class="brand-mark">ش</div><div><div class="brand-text">شفرة</div><div class="brand-sub" style="text-align:start">شفرة</div></div></div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">دخول</button>
      <button class="auth-tab" id="tab-signup">حساب جديد</button>
    </div>
    <div class="auth-error" id="auth-error"></div>

    <form id="login-form">

/* ============================================================
   شفرة — Customer / Marketer / Editor app.
   One codebase, role-adaptive: the backend already knows who's
   who (spec #69 "ONE BACKEND, SAME BUSINESS LOGIC"), so the nav
   and available actions adapt to req.user.role rather than
   shipping three separate apps with duplicated plumbing.
   Session token lives in memory only (not localStorage).
   ============================================================ */
const state = { token:null, user:null, profile:null, apiBase:'/api', view:null };

// Smart default: if this page itself isn't running on localhost (i.e. it's
// deployed behind the real domain), assume the API lives at /api on that same
// origin (matches the nginx reverse-proxy setup in shifra-deploy/). Local dev
// keeps pointing at the backend's own default port. Either way it's still a
// plain editable field, never hidden or hardcoded away from the user.
(function setSmartApiDefault(){
  const isLocal = ['localhost','127.0.0.1'].includes(location.hostname) || location.protocol === 'file:';
  const guess = isLocal ? 'http://localhost:4000/api' : '/api';
  state.apiBase = guess;
  document.getElementById('login-apibase').value = guess;
  document.getElementById('signup-apibase').value = guess;
})();

function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=> el.remove(), 4200);
}
async function api(path, opts={}){
  const method = opts.method || 'GET';
  const headers = Object.assign(
    {'Content-Type':'application/json','Cache-Control':'no-cache','Pragma':'no-cache'},
    state.token ? {Authorization:'Bearer '+state.token} : {}
  );
  const res = await fetch(state.apiBase + path, {
    method,
    headers,
    cache:'no-store',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  }).catch(()=>{ throw new Error('تعذر الوصول للسيرفر — '+state.apiBase); });
  let json = {};
  try { json = await res.json(); } catch(e) {}
  if(!res.ok){ if(res.status===401 && state.token) doLogout(); throw new Error((json.error && json.error.message) || ('HTTP '+res.status)); }
  return json;
}
const money = (minor) => (Number(minor)/100).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
const fmtDate = (d) => d ? new Date(d).toLocaleString('ar-EG',{dateStyle:'medium', timeStyle:'short'}) : '—';
const fmtDay = (d) => d ? new Date(d).toLocaleDateString('ar-EG',{dateStyle:'medium'}) : '—';
function esc(s){ const d=document.createElement('div'); d.textContent=(s===null||s===undefined)?'':s; return d.innerHTML; }
function whatsappUrl(phone,text=''){
  if(!phone) return null;
  const raw=String(phone).replace(/[^\d+]/g,'');
  let n=raw;
  if(n.startsWith('+')) n=n.slice(1); else if(n.startsWith('00')) n=n.slice(2); else if(n.startsWith('0')) n='20'+n.slice(1);
  return 'https://wa.me/'+n+(text?'?text='+encodeURIComponent(text):'');
}
function openWhatsApp(phone,text=''){
  const url=whatsappUrl(phone,text);
  if(!url){ toast('رقم WhatsApp غير متوفر في الحساب','err'); return false; }
  window.open(url,'_blank','noopener'); return true;
}

  CUSTOMER: 'اطلب خدمة مونتاج، تابع حالة مشروعك أول بأول، وافق على السعر، وراجع الشغل قبل التسليم النهائي.',

};

function switchAuthTab(which){
  document.getElementById('tab-login').classList.toggle('active', which==='login');
  document.getElementById('tab-signup').classList.toggle('active', which==='signup');
  document.getElementById('login-form').style.display = which==='login' ? 'block' : 'none';

(function autoDetectReferral(){
  const params = new URLSearchParams(location.search);
  const ref = params.get('ref');
  if (ref) {
    document.getElementById('su-referral').value = ref;
    switchAuthTab('signup');
  }

function authError(msg){ const e = document.getElementById('auth-error'); e.textContent = msg; e.style.display = 'block'; }

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-submit');
  document.getElementById('auth-error').style.display = 'none';
  state.apiBase = document.getElementById('login-apibase').value.trim().replace(/\/$/,'');
  btn.disabled = true; const orig = btn.textContent; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const identifier = document.getElementById('login-identifier').value.trim();
    const password = document.getElementById('login-password').value;
    const result = await api('/auth/login', {method:'POST', body:{identifier, password}});
    if(!result.token || !result.user) throw new Error('السيرفر لم يُرجع بيانات جلسة صحيحة');
    state.token = result.token;
    state.user = result.user;
    try {
      sessionStorage.setItem('shifra_auth_token_v2', result.token);
      sessionStorage.setItem('shifra_auth_user_v2', JSON.stringify(result.user));
    } catch (_) {}
    await loadMeAndEnter();
  } catch(err){ authError(err.message); }
  finally { btn.disabled = false; btn.textContent = orig; }
});

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signup-submit');
  document.getElementById('auth-error').style.display = 'none';
  state.apiBase = document.getElementById('signup-apibase').value.trim().replace(/\/$/,'');
  btn.disabled = true; const orig = btn.textContent; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const body = {
      role: signupRole,
      fullName: document.getElementById('su-name').value.trim(),
      email: document.getElementById('su-email').value.trim() || undefined,
      phone: document.getElementById('su-phone').value.trim() || undefined,
      password: document.getElementById('su-password').value,
    };
    if (signupRole === 'CUSTOMER') {
      const ref = document.getElementById('su-referral').value.trim();
      if (ref) body.referralCode = ref;
    }
    const result = await api('/auth/signup', {method:'POST', body});
    if(!result.token || !result.user) throw new Error('السيرفر لم يُرجع بيانات جلسة صحيحة');
    state.token = result.token;
    state.user = result.user;
    try {
      sessionStorage.setItem('shifra_auth_token_v2', result.token);
      sessionStorage.setItem('shifra_auth_user_v2', JSON.stringify(result.user));
    } catch (_) {}
    await loadMeAndEnter(result.customer || result.marketer || result.editor || null);
    toast('أهلًا بيك في شفرة', 'ok');
  } catch(err){ authError(err.message); }
  finally { btn.disabled = false; btn.textContent = orig; }
});

async function loadMeAndEnter(profileOverride = null){
  if (!state.user) {
    const me = await api('/auth/me');
    state.user = me.user;
  }
  if (state.user.role === 'OWNER' || state.user.role === 'ADMIN') {
    throw new Error('حساب الإدارة له لوحة تحكم منفصلة. استخدم رابط لوحة المالك.');
  }
  state.profile = profileOverride || null;
  if (!state.profile) {
    try {
      if (state.user.role === 'MARKETER') state.profile = (await api('/marketers/me')).marketer;
      else if (state.user.role === 'EDITOR') state.profile = (await api('/editors/me')).editor;
      else if (state.user.role === 'CUSTOMER') state.profile = (await api('/customers/me')).customer;
    } catch (profileErr) {
      console.warn('Role profile could not be loaded yet:', profileErr);
    }
  }
  enterApp();
}

function doLogout(){
  try{
    sessionStorage.removeItem('shifra_auth_token_v2');
    sessionStorage.removeItem('shifra_auth_user_v2');
    sessionStorage.removeItem('shifra_auth_token_v3');
    sessionStorage.removeItem('shifra_auth_user_v3');
    sessionStorage.removeItem('shifra_auth_form');
  }catch(_){ }
  state.token = null; state.user = null; state.profile = null;
  document.getElementById('app-shell').classList.remove('active');
  document.getElementById('auth-screen').style.display = 'flex';
  document.getElementById('login-password').value = '';
}
function openChangePasswordModal(){
  modal(`<h3>تغيير كلمة المرور</h3>
    <div class="field"><label>كلمة المرور الحالية</label><input type="password" id="cp-current" class="ltr"></div>
    <div class="field"><label>كلمة المرور الجديدة (8 أحرف على الأقل)</label><input type="password" id="cp-new" class="ltr"></div>
    <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="cp-confirm" class="ltr"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" id="cp-submit">تغيير</button></div>`);
  document.getElementById('cp-submit').addEventListener('click', async (e) => {
    const current = document.getElementById('cp-current').value;
    const next = document.getElementById('cp-new').value;
    const confirm = document.getElementById('cp-confirm').value;
    if (!current || !next) { toast('املا الخانتين', 'err'); return; }
    if (next.length < 8) { toast('كلمة المرور الجديدة لازم 8 أحرف على الأقل', 'err'); return; }
    if (next !== confirm) { toast('كلمة المرور الجديدة والتأكيد مش متطابقين', 'err'); return; }
    e.target.disabled = true;
    try {
      await api('/auth/change-password', {method:'POST', body:{currentPassword: current, newPassword: next}});
      closeModal(); toast('اتغيّرت كلمة المرور بنجاح', 'ok');
    } catch(err){ toast(err.message, 'err'); e.target.disabled = false; }
  });
}
document.getElementById('logout-btn-desktop').addEventListener('click', doLogout);
document.getElementById('user-menu-btn').addEventListener('click', () => {

async function refreshBellBadge(){
  try {
    const { notifications } = await api('/notifications');
    const unread = notifications.filter(n => !n.is_read).length;
    const badge = document.getElementById('bell-badge');
    if (unread > 0) { badge.style.display = 'flex'; badge.textContent = unread > 9 ? '9+' : unread; }
    else { badge.style.display = 'none'; }

function marketerCsv(filename, rows){
  if(!rows || !rows.length){ toast('مفيش بيانات للتصدير','err'); return; }
  var keys=Object.keys(rows[0]);
  var lines=[keys.join(','), ...rows.map(function(r){ return keys.map(function(k){ return '\"'+String(r[k] ?? '').replace(/\"/g,'\"\"')+'\"'; }).join(','); })];
  var blob=new Blob(['\\uFEFF'+lines.join('\\n')],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=filename; a.click(); setTimeout(function(){URL.revokeObjectURL(url);},500);
}

async function renderConversationView(host, projectId){
  const panel = document.getElementById('standalone-chat-panel');
  panel.innerHTML = '<div class="card"><span class="spinner"></span> جارِ تحميل المحادثة...</div>';

  try {
    const [{project}, {messages}] = await Promise.all([
      api(`/projects/${projectId}`),
      api(`/projects/${projectId}/messages`),
    ]);

    panel.innerHTML = `
      <div class="section-title">محادثة ${esc(project.order_number)}</div>
      <div class="chat-box">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px">
          <div>
            <div style="font-weight:700;font-size:16px">${esc(project.customer_name)}</div>
            <div style="font-size:12px;color:var(--text-faint)">
              المسوّق: ${esc(project.marketer_name || '—')} ·
              المحرر: ${esc(project.editor_name || 'لسه ماتعيّنش')}
            </div>
          </div>
          ${badge(project.status)}
        </div>

        <div class="chat-messages" id="standalone-chat-messages">
          ${renderChatMessages(messages)}
        </div>

        <div class="chat-input-row">
          <textarea id="standalone-chat-input" placeholder="اكتب رسالتك..." rows="1"></textarea>
          <button class="btn btn-primary btn-sm" id="standalone-chat-send">إرسال</button>
        </div>
      </div>
    `;

    const box = document.getElementById('standalone-chat-messages');
    if (box) box.scrollTop = box.scrollHeight;

    const send = async () => {
      const input = document.getElementById('standalone-chat-input');
      const button = document.getElementById('standalone-chat-send');
      const body = input.value.trim();
      if (!body) return;

      button.disabled = true;
      try {
        await api(`/projects/${projectId}/messages`, {
          method:'POST',
          body:{body}
        });
        input.value = '';
        const refreshed = await api(`/projects/${projectId}/messages`);
        document.getElementById('standalone-chat-messages').innerHTML = renderChatMessages(refreshed.messages);
        document.getElementById('standalone-chat-messages').scrollTop =
          document.getElementById('standalone-chat-messages').scrollHeight;
        toast('تم إرسال الرسالة','ok');
      } catch(err) {
        toast(err.message,'err');
      } finally {
        button.disabled = false;
      }
    };

    document.getElementById('standalone-chat-send').addEventListener('click', send);
    document.getElementById('standalone-chat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  } catch(err) {
    panel.innerHTML = `<div class="empty-state"><div class="ic">⚠</div>${esc(err.message)}</div>`;
  }
};

let catalogCache = null;
async function getCatalog(){
  if (catalogCache) return catalogCache;
  const { serviceTypes, contentTypes, editingLevels } = await api('/services/catalog');
  catalogCache = { st:Object.fromEntries(serviceTypes.map(x=>[x.code,x.name_en])),
    ct:Object.fromEntries(contentTypes.map(x=>[x.code,x.name_en])),
    el:Object.fromEntries(editingLevels.map(x=>[x.code,x.name_en])) };
  return catalogCache;
}

function renderChatMessages(messages){
  if (!messages.length) return '<div class="empty-state" style="padding:20px"><div class="ic">💬</div>ابدأ المحادثة</div>';
  return messages.map(m => {
    const mine = m.sender_id === state.user.id;
    return `<div class="chat-msg ${mine?'mine':'theirs'}">
      ${!mine ? `<div class="chat-meta">${esc(m.sender_name)}</div>` : ''}
      <div>${esc(m.body)}</div>
      <div class="chat-time">${fmtDate(m.created_at)}</div>
    </div>`;
  }).join('');
}
function scrollChatToBottom(){
  const box = document.getElementById('chat-messages');
  if (box) box.scrollTop = box.scrollHeight;
}
function wireChat(el, id){
  const sendBtn = document.getElementById('chat-send-btn');
  const input = document.getElementById('chat-input');
  const send = async () => {
    const body = input.value.trim();
    if (!body) return;
    sendBtn.disabled = true;
    try {
      await api(`/projects/${id}/messages`, {method:'POST', body:{body}});
      input.value = '';
      const { messages } = await api(`/projects/${id}/messages`);
      document.getElementById('chat-messages').innerHTML = renderChatMessages(messages);
      scrollChatToBottom();
    } catch(err){ toast(err.message, 'err'); }
    finally { sendBtn.disabled = false; }
  };
  sendBtn.addEventListener('click', send);

<script id="shefra-premium-motion">
(() => {
  const install = () => {
    const content = document.getElementById('content');
    if (content) {
      const pulse = () => {
        content.classList.remove('ui-refresh');
        requestAnimationFrame(() => content.classList.add('ui-refresh'));
      };
      new MutationObserver(pulse).observe(content,{childList:true});
    }
    document.addEventListener('click', (event) => {
      const target = event.target.closest('button,.btn,.nav-item,.auth-tab,.role-opt,.user-menu-btn');
      if (!target || target.disabled) return;
      const rect = target.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ui-ripple';
      ripple.style.left = ((event.clientX - rect.left) || rect.width/2) + 'px';
      ripple.style.top = ((event.clientY - rect.top) || rect.height/2) + 'px';
      target.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }, {passive:true});
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded',install,{once:true});
  else install();
})();
</script>
<script id="auth-rescue">
(() => {
  // Clean auth flow v3: one handler, one storage format, same-origin API in production.
  const TOKEN_KEY = 'shifra_auth_token_v3';
  const USER_KEY = 'shifra_auth_user_v3';
  const OLD_KEYS = ['shifra_auth_token_v2', 'shifra_auth_user_v2', 'shifra_auth_form'];
  const isLocal = ['localhost', '127.0.0.1'].includes(location.hostname) || location.protocol === 'file:';

  function storageGet(key) {
    try { return sessionStorage.getItem(key); } catch (_) { return null; }
  }
  function storageSet(key, value) {
    try { sessionStorage.setItem(key, value); } catch (_) {}
  }
  function storageRemove(key) {
    try { sessionStorage.removeItem(key); } catch (_) {}
  }
  function clearAuthStorage() {
    storageRemove(TOKEN_KEY);
    storageRemove(USER_KEY);
    OLD_KEYS.forEach(storageRemove);
  }

  function resolveApiBase(form) {
    if (!isLocal) return '/api';
    const input = document.getElementById(form === 'signup' ? 'signup-apibase' : 'login-apibase');
    return (input?.value || 'http://localhost:4000/api').trim().replace(/\/$/, '');
  }

  async function request(path, options = {}) {
    const headers = {
      'Accept': 'application/json',
      'Content-Type': 'application/json',
      'Cache-Control': 'no-store',
      'Pragma': 'no-cache',
      ...(options.token ? { Authorization: 'Bearer ' + options.token } : {})
    };
    const response = await fetch((options.base || '/api') + path, {
      method: options.method || 'GET',
      headers,
      cache: 'no-store',
      credentials: 'same-origin',
      body: options.body === undefined ? undefined : JSON.stringify(options.body)
    });

    let data = {};
    try { data = await response.json(); } catch (_) {}

    if (!response.ok) {
      const message = data?.error?.message || data?.message || ('HTTP ' + response.status);
      const error = new Error(message);
      error.status = response.status;
      error.data = data;
      throw error;
    }
    return data;
  }

  function setAuthMessage(message, kind = 'error') {
    const el = document.getElementById('auth-error');
    if (!el) return;
    el.textContent = message || '';
    el.style.display = message ? 'block' : 'none';
    el.dataset.kind = kind;
  }

  function setBusy(form, busy) {
    const btn = document.getElementById(form === 'signup' ? 'signup-submit' : 'login-submit');
    if (!btn) return;
    btn.disabled = busy;
    btn.dataset.authBusy = busy ? '1' : '0';
    btn.textContent = busy ? 'جارٍ التنفيذ...' : (form === 'signup' ? 'إنشاء الحساب' : 'دخول');
  }

  function persistSession(result) {
    if (!result?.token || !result?.user?.id || !result?.user?.role) {
      throw new Error('السيرفر لم يُرجع جلسة دخول مكتملة');
    }
    clearAuthStorage();
    storageSet(TOKEN_KEY, result.token);
    storageSet(USER_KEY, JSON.stringify(result.user));
    state.token = result.token;
    state.user = result.user;
    state.profile = result.customer || result.marketer || result.editor || null;
  }

  function showAuthenticatedApp() {
    if (!state.user) throw new Error('بيانات المستخدم غير موجودة');
    if (state.user.role === 'OWNER' || state.user.role === 'ADMIN') {
      throw new Error('حساب الإدارة يستخدم رابط لوحة المالك، وليس تطبيق العملاء والمسوقين والمونتيرين.');
    }
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-shell').classList.add('active');
    enterApp();
  }

  async function refreshProfileInBackground() {
    if (!state.token || !state.user) return;
    try {
      let result = null;
      if (state.user.role === 'CUSTOMER') result = await request('/customers/me', {base: state.apiBase || '/api', token: state.token});
      else if (state.user.role === 'MARKETER') result = await request('/marketers/me', {base: state.apiBase || '/api', token: state.token});
      else if (state.user.role === 'EDITOR') result = await request('/editors/me', {base: state.apiBase || '/api', token: state.token});
      if (result) {
        state.profile = result.customer || result.marketer || result.editor || state.profile;
      }
    } catch (_) {
      // Profile data is optional for entering the app. Never bounce a valid login back to the login screen.
    }
  }

  async function handleSubmit(formName, event) {
    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    const form = document.getElementById(formName === 'signup' ? 'signup-form' : 'login-form');
    if (!form || form.dataset.authBusy === '1') return;
    form.dataset.authBusy = '1';
    setAuthMessage('');
    setBusy(formName, true);

    try {
      const base = resolveApiBase(formName);
      state.apiBase = base;

      let body;
      if (formName === 'signup') {
        const role = typeof signupRole === 'string' ? signupRole : 'CUSTOMER';
        const fullName = document.getElementById('su-name')?.value.trim() || '';
        const email = document.getElementById('su-email')?.value.trim() || '';
        const phone = document.getElementById('su-phone')?.value.trim() || '';
        const password = document.getElementById('su-password')?.value || '';
        if (!fullName) throw new Error('اكتب الاسم بالكامل');
        if (!email && !phone) throw new Error('اكتب البريد الإلكتروني أو رقم الهاتف');
        if (password.length < 8) throw new Error('كلمة المرور لازم تكون 8 أحرف على الأقل');
        body = { role, fullName, email: email || undefined, phone: phone || undefined, password };
        if (role === 'CUSTOMER') {
          const referralCode = document.getElementById('su-referral')?.value.trim() || '';
          if (referralCode) body.referralCode = referralCode;
        }
      } else {
        const identifier = document.getElementById('login-identifier')?.value.trim() || '';
        const password = document.getElementById('login-password')?.value || '';
        if (!identifier || !password) throw new Error('اكتب البريد/الهاتف وكلمة المرور');
        body = { identifier, password };
      }

      const result = await request(formName === 'signup' ? '/auth/signup' : '/auth/login', {
        base,
        method: 'POST',
        body
      });

      persistSession(result);

      // Enter the actual app immediately. Profile loading is secondary and cannot kick
      // the user back to the auth screen.
      showAuthenticatedApp();
      void refreshProfileInBackground();

      toast(formName === 'signup' ? 'تم إنشاء الحساب ودخولك للتطبيق' : 'تم تسجيل الدخول', 'ok');
    } catch (error) {
      clearAuthStorage();
      state.token = null;
      state.user = null;
      state.profile = null;
      document.getElementById('app-shell').classList.remove('active');
      document.getElementById('auth-screen').style.display = 'flex';
      setAuthMessage(error?.message || 'حصل خطأ أثناء تسجيل الدخول');
    } finally {
      form.dataset.authBusy = '0';
      setBusy(formName, false);
    }
  }

  function bootstrapSavedSession() {
    const token = storageGet(TOKEN_KEY);
    const rawUser = storageGet(USER_KEY);
    if (!token || !rawUser) return;

    try {
      const user = JSON.parse(rawUser);
      if (!user?.id || !user?.role || user.role === 'OWNER' || user.role === 'ADMIN') {
        clearAuthStorage();
        return;
      }

      state.token = token;
      state.user = user;
      state.apiBase = isLocal ? (document.getElementById('login-apibase')?.value || 'http://localhost:4000/api') : '/api';

      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-shell').classList.add('active');
      enterApp();

      // Verify the saved token without blocking the UI. A failure clears the stale session.
      request('/auth/me', {base: state.apiBase, token})
        .then(result => {
          if (result?.user) {
            state.user = result.user;
            storageSet(USER_KEY, JSON.stringify(result.user));
            void refreshProfileInBackground();
          }
        })
        .catch(error => {
          if (error?.status === 401) {
            clearAuthStorage();
            state.token = null;
            state.user = null;
            state.profile = null;
            document.getElementById('app-shell').classList.remove('active');
            document.getElementById('auth-screen').style.display = 'flex';
            setAuthMessage('انتهت جلسة الدخول. سجل دخولك مرة أخرى.');
          }
        });
    } catch (_) {
      clearAuthStorage();
    }
  }

  function install() {
    // Start clean: old v2 auth state was part of the previous broken flow.
    OLD_KEYS.forEach(storageRemove);

    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');

    if (loginForm) {
      loginForm.addEventListener('submit', event => { void handleSubmit('login', event); }, true);
    }
    if (signupForm) {
      signupForm.addEventListener('submit', event => { void handleSubmit('signup', event); }, true);
    }

    if (!isLocal) {
      const loginBase = document.getElementById('login-apibase');
      const signupBase = document.getElementById('signup-apibase');
      if (loginBase) loginBase.value = 'https://api-production-2964.up.railway.app/api';
      if (signupBase) signupBase.value = 'https://api-production-2964.up.railway.app/api';
    }

    bootstrapSavedSession();
  }

  window.shifraAuthV3 = { clearAuthStorage, bootstrapSavedSession };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', install, {once: true});
  } else {
    install();
  }
})();
</script>

<script id="shifra-preview-mode">
(() => {
  // Preview mode: no registration/login. Choose a persona and enter directly.
  const PERSONAS = {
    editor: {
      role: 'EDITOR',
      fullName: 'مونتير — وضع المعاينة',
      label: 'مونتير',
      icon: '🎬',
      sub: 'شوف واجهة المونتير والمهام'
    },
    marketer: {
      role: 'MARKETER',
      fullName: 'مسوق — وضع المعاينة',
      label: 'مسوق',
      icon: '📈',
      sub: 'شوف واجهة المسوق والفرص'
    },
    youssef: {
      role: 'OWNER_PREVIEW',
      fullName: 'يوسف — وضع المعاينة',
      label: 'يوسف',
      icon: '👤',
      sub: 'دخول معاينة باسم يوسف'
    },
    omar: {
      role: 'OWNER_PREVIEW',
      fullName: 'عمر — وضع المعاينة',
      label: 'عمر',
      icon: '👑',
      sub: 'دخول معاينة باسم عمر'
    },
    customer: {
      role: 'CUSTOMER',
      fullName: 'العميل — وضع المعاينة',
      label: 'العميل',
      icon: '🛍️',
      sub: 'شوف تجربة العميل'
    }
  };

  // Owner-preview identities use the customer shell for now so the internal
  // product can be explored without a real account.
  NAV_BY_ROLE.OWNER_PREVIEW = NAV_BY_ROLE.CUSTOMER;

  const arrayKeys = new Set([
    'projects','conversations','notifications','ratings','messages','leads',
    'opportunities','customers','earnings','payments','revisions','complaints',
    'items','results','data','users','accounts','payouts','transactions'
  ]);

  let activePersona = null;

  api = async function previewApi(path, opts = {}) {
    const method = (opts.method || 'GET').toUpperCase();
    if (method !== 'GET') {
      return { ok: true, success: true, message: 'تمت المحاكاة — وضع المعاينة' };
    }
    if (path.includes('/notifications')) return { notifications: [] };
    if (path.includes('/projects')) return { projects: [] };
    if (path.includes('/conversations')) return { conversations: [] };
    if (path.includes('/ratings')) return { ratings: [] };
    if (path.includes('/complaints')) return { complaints: [] };
    if (path.includes('/payments')) return { payments: [] };

    return new Proxy({}, {
      get(_target, prop) {
        if (prop === 'user') return activePersona ? {
          id: 0,
          role: activePersona.role,
          fullName: activePersona.fullName,
          email: 'preview@shifra.local',
          phone: ''
        } : null;
        if (prop === 'customer') return { id:0, full_name:activePersona?.fullName || '', email:'preview@shifra.local', phone:'وضع المعاينة', status:'ACTIVE' };
        if (prop === 'marketer') return { id:0, full_name:activePersona?.fullName || '', level:'PREVIEW', status:'ACTIVE' };
        if (prop === 'editor') return { id:0, full_name:activePersona?.fullName || '', level:'PREVIEW', status:'ACTIVE' };
        if (prop === 'profile') return {};
        if (arrayKeys.has(String(prop))) return [];
        return 0;
      }
    });
  };

  function boot(personaKey) {
    activePersona = PERSONAS[personaKey];
    state.token = 'preview-mode';
    state.user = {
      id: 0,
      role: activePersona.role,
      fullName: activePersona.fullName,
      email: 'preview@shifra.local',
      phone: ''
    };
    state.profile = {
      id: 0,
      full_name: activePersona.fullName,
      email: 'preview@shifra.local',
      phone: 'وضع المعاينة'
    };
    state.apiBase = '/api';

    const chooser = document.getElementById('shifra-preview-chooser');
    if (chooser) chooser.remove();
    const auth = document.getElementById('auth-screen');
    if (auth) auth.style.display = 'none';
    const shell = document.getElementById('app-shell');
    if (shell) shell.classList.add('active');

    const old = document.getElementById('shifra-preview-banner');
    if (old) old.remove();
    const banner = document.createElement('div');
    banner.id = 'shifra-preview-banner';
    banner.textContent = 'وضع المعاينة — بدون تسجيل';
    banner.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9999;background:rgba(139,92,246,.95);color:#fff;padding:7px 14px;border-radius:999px;font:600 12px/1.2 var(--font);box-shadow:0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(8px);';
    document.body.appendChild(banner);

    enterApp();
  }

  const auth = document.getElementById('auth-screen');
  if (auth) auth.style.display = 'none';

  const chooser = document.createElement('div');
  chooser.id = 'shifra-preview-chooser';
  chooser.innerHTML = `
    <div class="shifra-preview-card">
      <div class="shifra-preview-brand">
        <div class="brand-mark">ش</div>
        <div>
          <div class="brand-text">شفرة</div>
          <div class="brand-sub">PREVIEW MODE</div>
        </div>
      </div>
      <h1>اختار هتدخل كمين؟</h1>
      <p class="shifra-preview-sub">مفيش تسجيل أو كلمة مرور. اختار الشخصية وادخل التطبيق مباشرة.</p>
      <div class="shifra-preview-grid">
        ${Object.entries(PERSONAS).map(([key,p]) => `
          <button class="shifra-persona" data-preview-persona="${key}">
            <span class="shifra-persona-icon">${p.icon}</span>
            <span class="shifra-persona-name">${p.label}</span>
            <span class="shifra-persona-sub">${p.sub}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
  document.body.appendChild(chooser);

  const style = document.createElement('style');
  style.textContent = `
    #shifra-preview-chooser{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse 700px 500px at 50% -10%,rgba(139,92,246,.18),transparent 65%);}
    .shifra-preview-card{width:100%;max-width:560px;background:rgba(19,19,24,.88);border:1px solid var(--border);border-radius:22px;padding:28px;box-shadow:0 30px 90px -35px rgba(0,0,0,.95);backdrop-filter:blur(14px);}
    .shifra-preview-brand{display:flex;align-items:center;gap:10px;margin-bottom:24px;}
    .shifra-preview-brand .brand{margin-bottom:0;}
    #shifra-preview-chooser h1{font-size:24px;margin-bottom:6px;}
    .shifra-preview-sub{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
    .shifra-preview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    .shifra-persona{border:1px solid var(--border);background:var(--bg-elev);color:var(--text);border-radius:16px;padding:17px 14px;text-align:right;display:flex;flex-direction:column;gap:5px;transition:.18s;min-height:112px;}
    .shifra-persona:hover{transform:translateY(-2px);border-color:rgba(155,124,255,.55);background:var(--bg-elev-2);box-shadow:0 14px 34px -24px rgba(139,92,246,.7);}
    .shifra-persona-icon{font-size:25px;}
    .shifra-persona-name{font-weight:700;font-size:15px;}
    .shifra-persona-sub{font-size:11.5px;color:var(--text-faint);}
    @media(max-width:520px){.shifra-preview-grid{grid-template-columns:1fr}.shifra-preview-card{padding:22px}.shifra-persona{min-height:96px}}
  `;
  document.head.appendChild(style);

  chooser.querySelectorAll('[data-preview-persona]').forEach(btn => {
    btn.addEventListener('click', () => boot(btn.dataset.previewPersona));
  });
})();
</script>
