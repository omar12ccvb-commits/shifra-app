worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
      proxy_pass https://api-production-2964.up.railway.app/api/;
      proxy_http_version 1.1;
      proxy_set_header Host api-production-2964.up.railway.app;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_ssl_server_name on;
      proxy_ssl_name api-production-2964.up.railway.app;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
      proxy_buffering off;
    }

    location = /health {
      proxy_pass https://api-production-2964.up.railway.app/health;
      proxy_http_version 1.1;
      proxy_set_header Host api-production-2964.up.railway.app;
      proxy_ssl_server_name on;
      proxy_ssl_name api-production-2964.up.railway.app;
    }

    location = / {
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      expires 0;
      try_files /index.html =404;
    }
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
      expires 0;
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
